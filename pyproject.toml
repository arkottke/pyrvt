[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyRVT"
dynamic = ["version"]
authors = [{ name = "Albert Kottke", email = "albert.kottke@gmail.com" }]
description = "Random vibration theory for earthquake ground motions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
# Lower bounds follow SPEC 0: the oldest minor released within the last
# 24 months. See the SPEC 0 note below for the review schedule.
dependencies = [
  "numpy>=2.2",
  "numba>=0.61",
  "scipy>=1.15",
]

# ---------------------------------------------------------------------------
# SPEC 0 -- Minimum Supported Dependencies
# https://scientific-python.org/specs/spec-0000/
#
# Python:        support minors released in the last 36 months.
# Core packages: support minors released in the last 24 months.
#
# Reviewed 2026-11-03. Next scheduled changes:
#   2026-12-08  numpy >=2.3       (2.2 released 2024-12-08)
#   2027-01-03  scipy >=1.16      (1.15 released 2025-01-03)
#   2027-01-20  numba >=0.62      (0.61 released 2025-01-20)
#   2027-10-07  drop Python 3.13  -> requires-python >=3.14
# ---------------------------------------------------------------------------

[project.optional-dependencies]
# Spreadsheet input and output, used by the `pyrvt` command line tool
cli = ["pyexcel", "pyexcel-io", "pyexcel-xlsx"]
test = [
  "pyRVT[cli]",
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  "pystrata",
]
docs = [
  "sphinx",
  "furo",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex",
  "sphinxext-opengraph",
  "sphinx-autobuild",
  "matplotlib",
  "myst-parser",
  "nbsphinx",
  "ipython",
  "linkify-it-py",
]
style = ["ruff"]

[project.urls]
Homepage = "https://github.com/arkottke/pyrvt"
Documentation = "https://pyrvt.readthedocs.io"

[project.scripts]
pyrvt = "pyrvt.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/pyrvt/_version.py"

[tool.ruff]
exclude = ["docs"]
line-length = 88
indent-width = 4

target-version = "py313"

extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I", "UP", "D"]
ignore = ["E203", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D401"]

# Docstrings follow the NumPy convention. Missing docstrings (D100-D107) are
# tracked separately; D401 (imperative mood) is a matter of taste.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["src/pyrvt"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
]
