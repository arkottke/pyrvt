repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.4.3
    hooks:
      # Run the linter.
      - id: ruff
        args:
          [--fix]
          # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: check-json
      # Unsafe required for mkdocs.yml format
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
  - repo: local
    hooks:
      # Pinned: the pre-commit mirror only offers 4.0 alphas after 3.1.0, and
      # 4.0.0-alpha.8 hangs. Needs node on PATH.
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.9.10"]
        files: \.(md|yml)$
